name: Publish to MCP Registry
# Publishes server.json to the MCP Registry when a release is published, or by hand.
# GitHub's OIDC token proves the run comes from the sigship organisation, so no personal token is needed.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check server.json matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          srv=$(node -p "require('./server.json').version")
          test "$pkg" = "$srv" || { echo "package.json is $pkg but server.json is $srv"; exit 1; }
      - name: Wait for this version on npm
        # The npm workflow runs at the same time, and the registry refuses a version npm does not show yet.
        run: |
          name=$(node -p "require('./package.json').name")
          pkg=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            npm view "$name@$pkg" version >/dev/null 2>&1 && exit 0
            echo "$name@$pkg is not on npm yet, waiting 15 seconds"
            sleep 15
          done
          echo "$name@$pkg did not appear on npm within 10 minutes"
          exit 1
      - name: Install mcp-publisher
        run: curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Sign in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
