name: Publish to MCP Registry
# Publishes server.json to the MCP Registry when a release is published, or by hand.
# GitHub's OIDC token proves the run comes from the sigship organisation, so no personal token is needed.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check server.json matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          srv=$(node -p "require('./server.json').version")
          test "$pkg" = "$srv" || { echo "package.json is $pkg but server.json is $srv"; exit 1; }
      - name: Install mcp-publisher
        run: curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Sign in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
